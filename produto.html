<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TikTok Shop - Produto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-900 font-sans pb-24 select-none">

  <!-- CABEÇALHO -->
  <header class="sticky top-0 z-30 bg-white px-3 py-2 flex items-center justify-between border-b border-gray-100">
    <button class="text-xl text-gray-800 pr-2"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="flex-1 mx-2 relative">
      <input type="text" placeholder="Search" class="w-full bg-white border border-red-400 rounded-full py-1.5 pl-9 pr-4 text-sm focus:outline-none">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-red-500 text-xs"></i>
    </div>
    <div class="w-8 h-8 rounded-full bg-pink-100 border border-pink-300 flex items-center justify-center text-pink-600 text-[10px] font-bold">Pink</div>
  </header>

  <!-- FAIXA PROMOÇÃO FLASH -->
  <div class="bg-pink-100 px-4 py-2 flex items-center justify-between text-xs text-pink-700 font-bold">
    <div><span class="bg-[#ff2c55] text-white px-1.5 py-0.5 rounded text-[10px]">-80%</span> A partir de R$ 17,99</div>
    <div>Termina em 15:44:00</div>
  </div>

  <!-- CARROSSEL DE FOTOS -->
  <div class="relative w-full bg-white">
    <div id="carousel" class="flex overflow-x-auto snap-x snap-mandatory no-scrollbar w-full h-[400px]">
      <img src="https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?q=80&w=800&auto=format&fit=crop" class="w-full h-[400px] object-cover flex-shrink-0 snap-center">
      <img src="https://images.unsplash.com/photo-1596755094514-f87e34085b2c?q=80&w=800&auto=format&fit=crop" class="w-full h-[400px] object-cover flex-shrink-0 snap-center">
    </div>
    <div class="absolute bottom-3 right-3 bg-black/40 text-white text-[11px] px-2.5 py-0.5 rounded-full font-medium">
      <span id="img-index">1</span> / 9
    </div>
  </div>

  <!-- TÍTULO E PREÇO -->
  <div class="bg-white p-4 mb-2">
    <div class="flex items-baseline space-x-2">
      <span class="text-2xl font-bold text-gray-900">R$ 17,99</span>
      <span class="text-xs text-gray-400 line-through">R$ 90,00</span>
    </div>
    <h1 class="font-semibold text-sm leading-snug mt-1.5 text-gray-900">
      Camisa Masculina Gola Padre Manga Curta Lisa Casual Moderna Leve Confortável...
    </h1>
  </div>

  <!-- BARRA FIXA INFERIOR (COMPRAR) -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-2.5 z-40 flex items-center space-x-3 px-4">
    <a href="index.html" class="flex flex-col items-center justify-center text-gray-600 text-xs">
      <i class="fa-solid fa-store text-lg"></i>
      <span class="text-[10px]">Loja</span>
    </a>
    <a href="chat.html" class="flex flex-col items-center justify-center text-gray-600 text-xs">
      <i class="fa-regular fa-comment-dots text-lg"></i>
      <span class="text-[10px]">Chat</span>
    </a>
    <!-- Botão que vai direto para o checkout de endereço -->
    <a href="checkout.html" class="flex-1 bg-[#ff2c55] hover:bg-[#e02547] text-white font-bold py-2.5 rounded-full text-center shadow-md leading-tight block">
      <div class="text-base font-extrabold">R$ 17,99</div>
      <div class="text-[10px] font-normal opacity-90">Apenas para novos clientes</div>
    </a>
  </div>

  <script src="app.js"></script>
</body>
</html>
