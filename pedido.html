<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedido Confirmado</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans p-4 flex flex-col items-center justify-center min-h-screen">
  <main class="max-w-md w-full bg-white rounded-2xl p-6 text-center shadow-sm border border-gray-100">
    <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold mb-3">✓</div>
    <h1 class="text-lg font-black text-gray-900 mb-1">Pedido Aprovado com Sucesso!</h1>
    <p class="text-xs text-gray-500 mb-6">Processado e validado via Asaas Gateway.</p>

    <div class="bg-gray-50 rounded-xl p-4 text-left text-xs space-y-2 mb-6">
      <div class="flex justify-between"><span class="text-gray-500">ID do Pedido:</span><strong id="pedidoId">-</strong></div>
      <div class="flex justify-between"><span class="text-gray-500">Cliente:</span><strong id="pedidoCliente">-</strong></div>
      <div class="flex justify-between"><span class="text-gray-500">Valor Total:</span><strong id="pedidoTotal" class="text-emerald-600">-</strong></div>
      <div class="flex justify-between"><span class="text-gray-500">Status:</span><strong class="text-emerald-600">Pago / Liberado</strong></div>
    </div>

    <a href="index.html" class="block w-full bg-black text-white font-bold py-3 rounded-xl text-sm">
      Voltar para a Loja
    </a>
  </main>

  <script>
    const orders = JSON.parse(localStorage.getItem("shop_orders") || "[]");
    const currentOrder = orders[orders.length - 1];
    if(currentOrder) {
      document.getElementById("pedidoId").textContent = currentOrder.id;
      document.getElementById("pedidoCliente").textContent = currentOrder.customer;
      document.getElementById("pedidoTotal").textContent = "R$ " + Number(currentOrder.total).toFixed(2);
    }
  </script>
</body>
</html>
