<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Adicionar endereço - TikTok Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800 pb-20">

  <header class="bg-white px-4 py-3 flex items-center justify-between border-b border-gray-200">
    <a href="index.html" class="text-gray-700 text-lg"><i class="fa-solid fa-chevron-left"></i></a>
    <h1 class="font-bold text-base text-gray-900">Adicionar endereço</h1>
    <span class="w-5"></span>
  </header>

  <form action="pagamento.html" method="GET" class="p-4 space-y-4 max-w-md mx-auto">
    <div class="bg-white rounded-xl p-4 space-y-3 border border-gray-200 shadow-sm">
      <div>
        <label class="text-xs font-bold text-gray-600 block mb-1">Nome completo</label>
        <input type="text" required placeholder="Digite seu nome e sobrenome" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-[#ff2c55]">
      </div>

      <div>
        <label class="text-xs font-bold text-gray-600 block mb-1">WhatsApp / Telefone</label>
        <input type="tel" required placeholder="(11) 99999-9999" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-[#ff2c55]">
      </div>

      <div>
        <label class="text-xs font-bold text-gray-600 block mb-1">E-mail para rastreio</label>
        <input type="email" required placeholder="seuemail@gmail.com" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-[#ff2c55]">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">CEP</label>
          <input type="text" required placeholder="00000-000" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-[#ff2c55]">
        </div>
        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">Número</label>
          <input type="text" required placeholder="123" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-[#ff2c55]">
        </div>
      </div>

      <div>
        <label class="text-xs font-bold text-gray-600 block mb-1">Endereço (Rua / Avenida)</label>
        <input type="text" required placeholder="Ex: Av. Paulista" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-[#ff2c55]">
      </div>

      <div>
        <label class="text-xs font-bold text-gray-600 block mb-1">Complemento / Referência</label>
        <input type="text" placeholder="Apto, Bloco, Próximo ao mercado" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-[#ff2c55]">
      </div>
    </div>

    <button type="submit" class="w-full bg-[#ff2c55] hover:bg-[#e02547] text-white font-bold py-3.5 rounded-full text-base shadow-lg transition">
      Salvar e Continuar
    </button>
  </form>

</body>
</html>
