<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pagamento Seguro - TikTok Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800 p-4">

  <div class="max-w-md mx-auto bg-white rounded-2xl p-5 border border-gray-200 shadow-sm space-y-4 mt-10">
    <div class="flex justify-between items-center border-b border-gray-100 pb-3">
      <span class="text-xs font-bold uppercase text-gray-500">Total a pagar:</span>
      <span class="text-2xl font-extrabold text-[#ff2c55]">R$ 17,99</span>
    </div>

    <!-- SELETOR DE PAGAMENTO LIMPO -->
    <div class="space-y-3 pt-2">
      <!-- Opção PIX -->
      <button onclick="alert('Gerando QR Code PIX...')" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl text-sm flex items-center justify-center space-x-2 shadow">
        <i class="fa-solid fa-qrcode text-lg"></i>
        <span>PIX (Aprovação Imediata)</span>
      </button>

      <!-- Opção Cartão de Crédito (Processado via Stripe em background, sem expor o nome) -->
      <button onclick="alert('Abrindo formulário seguro de cartão...')" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-3.5 rounded-xl text-sm flex items-center justify-center space-x-2 shadow">
        <i class="fa-solid fa-credit-card text-lg"></i>
        <span>Cartão de Crédito</span>
      </button>
    </div>

    <div class="text-center pt-3 text-[11px] text-gray-400 flex items-center justify-center space-x-1">
      <i class="fa-solid fa-lock"></i>
      <span>Ambiente Seguro e Criptografado 256-bit</span>
    </div>
  </div>

</body>
</html>
