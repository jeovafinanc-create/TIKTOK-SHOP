<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TikTok Shop - Apple Official Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body class="bg-gray-100 pb-28 font-sans text-gray-800">

  <!-- TOPO NATIVO TIKTOK SHOP -->
  <header class="sticky top-0 z-50 bg-white px-4 py-3 flex items-center justify-between border-b border-gray-200 shadow-sm">
    <button class="text-gray-800 text-lg"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="flex-1 mx-3 bg-gray-100 rounded-full flex items-center px-3.5 py-1.5 text-xs text-gray-500 border border-gray-200">
      <i class="fa-solid fa-magnifying-glass mr-2 text-red-500"></i>
      <span>Buscar na loja...</span>
    </div>
    <div class="w-7 h-7 rounded-full bg-pink-100 flex items-center justify-center text-[#ff2c55] text-xs font-bold">
      <i class="fa-solid fa-bag-shopping"></i>
    </div>
  </header>

  <!-- CARROSSEL DE 5 FOTOS REAIS DOS IPHONES -->
  <div class="relative bg-white">
    <div class="swiper mySwiper w-full h-80">
      <div class="swiper-wrapper">
        <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=600" class="w-full h-full object-cover" alt="iPhone 15 Pro Max"></div>
        <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1695048065057-08b5e6795f70?w=600" class="w-full h-full object-cover" alt="iPhone 16 Pro Max"></div>
        <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600" class="w-full h-full object-cover" alt="iPhone 17 Pro Max"></div>
        <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=600" class="w-full h-full object-cover" alt="iPhone 18 Pro Max"></div>
        <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1580910051074-3eb694886505?w=600" class="w-full h-full object-cover" alt="iPhone 18 Ultra"></div>
      </div>
      <!-- Paginação numérica estilo TikTok Shop -->
      <div class="absolute bottom-3 right-3 bg-black/60 text-white text-[11px] px-2 py-0.5 rounded-full z-10 font-mono" id="slideCounter">1 / 5</div>
    </div>
  </div>

  <!-- PREÇO E DESCONTO -->
  <div class="bg-white px-4 py-3 border-b border-gray-100">
    <div class="flex items-baseline space-x-2">
      <span class="text-xs font-bold bg-[#ff2c55]/10 text-[#ff2c55] px-1.5 py-0.5 rounded">-80%</span>
      <span class="text-2xl font-black text-[#ff2c55]">R$ 35,99</span>
      <span class="text-xs text-gray-400 line-through">R$ 8.999,00</span>
    </div>
    <h1 class="text-xs font-medium leading-snug mt-2 text-gray-900">
      Apple iPhone Titanium Series Pro Max & Ultra (Modelos 15, 16, 17, 18 Pro Max e 18 Ultra) - 256GB / 512GB - Lacrado com Garantia
    </h1>
    <div class="flex items-center justify-between mt-3 text-xs text-gray-500 pt-2
